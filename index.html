<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>natalie</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="messages.js" defer></script><script src="script.js" defer></script>
</head>
<body>
<button id="theme-switch" class="theme-switch" aria-pressed="false">Pusheen theme</button><main><img class="characters pusheen-friends" src="pusheen-friends.png" alt="Pusheen, Stormy and Pip with donuts, ice cream and pastel hearts" draggable="false"><img class="characters" src="characters.png" alt="Naomi Misora and Ryuk on the left, Light Yagami and Rem on the right" draggable="false">
<button id="cover" class="cover" aria-label="Open Death Note"><span class="pusheen-cover"><span class="pusheen-title">Pusheen</span><img src="pusheen.png" alt="Pusheen holding a heart" draggable="false"></span><img class="cover-title" src="cover-title.svg" alt="Death Note" draggable="false"></button>
<section id="notebook" class="notebook" aria-label="Open Death Note" hidden>
<div class="spread advent-spread"><div class="dedication"><span id="page-label"></span><h1 id="page-title"></h1><span id="page-count"></span></div><article class="message-page" tabindex="0" aria-live="polite"><span id="message-symbol" aria-hidden="true">♡</span><p id="message"></p><span id="unlock-note"></span></article></div>
<nav aria-label="Navigazione del calendario"><button id="previous" aria-label="Pagina precedente">←</button><button id="close">Chiudi</button><button id="next" aria-label="Pagina successiva">→</button></nav>

</section>
</main>
</body>
</html>
